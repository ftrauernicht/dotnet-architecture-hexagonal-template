version: 2

updates:
  # NuGet packages. Central Package Management is on (ManagePackageVersionsCentrally=true in
  # Directory.Packages.props). The repository is flat — that file, the .slnx, src/ and tests/
  # all sit at the root, so the root is what Dependabot scans.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    # Patch and minor updates travel as one pull request, not nine. The group name ends up
    # in the branch, and .github/workflows/dependabot-auto-merge.yml merges a branch with
    # that name once every check on it is green. A major version belongs to no group, so it
    # arrives on its own and waits for a human.
    groups:
      safe:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows in this repo (checkout, setup-dotnet, upload-artifact,
  # test-reporter, trivy-action, etc.) — keeps the CI supply chain itself patched, and bumps the
  # SHA pins in the workflow files.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    # Patch and minor updates travel as one pull request, not nine. The group name ends up
    # in the branch, and .github/workflows/dependabot-auto-merge.yml merges a branch with
    # that name once every check on it is green. A major version belongs to no group, so it
    # arrives on its own and waits for a human.
    groups:
      safe:
        update-types: ["minor", "patch"]
