name: Tests

on:
  # Manual trigger for on-demand pipeline testing (Actions -> Run workflow).
  # Note: the coverage job stays PR-only (it needs a PR base to diff against).
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; the reporting step below elevates only its own job.
permissions:
  contents: read

jobs:
  test:
    name: Tests + Report
    runs-on: ubuntu-latest
    # The test-reporter step needs to create check runs / comment on the PR.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore App.slnx

      - name: Build (Release)
        run: dotnet build App.slnx -c Release --no-restore

      - name: Test (unit + architecture + Reqnroll specs)
        # A single `dotnet test` over the .slnx runs every xUnit v3 test project, including
        # App.Architecture.Tests and the Reqnroll specs (they execute as ordinary xUnit v3 tests).
        # No `if: always()` here: with --no-build this step must NOT run when the build failed
        # (it would only fail again on missing outputs — noise, no signal). The report and upload
        # steps below keep always() so results are still published when tests fail.
        run: dotnet test App.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Publish test report
        # Fallback if this action is not available (e.g. not allowlisted on GHE): rely solely on
        # the upload-artifact step below, which always runs and needs no marketplace action.
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc  # v1
        if: always()
        with:
          name: Test Results
          path: "TestResults/*.trx"
          reporter: dotnet-trx

      - name: Upload TRX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: test-results-trx
          path: TestResults/**
          retention-days: 30

  coverage:
    name: Diff Coverage
    runs-on: ubuntu-latest
    # Coverage is a diff against the PR base; a push to main has no meaningful base to diff
    # against, so this job only runs for pull requests.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python (for diff-cover)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch main (diff base)
        # actions/checkout only fetches the PR ref's history, not a local origin/main ref. The
        # base commit's objects are already present (fetch-depth: 0); this creates the ref that
        # diff-cover's --compare-branch resolves against.
        run: git fetch origin main

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage --version 17.14.1

      - name: Install diff-cover
        run: python -m pip install diff-cover==9.2.0

      - name: Restore
        run: dotnet restore App.slnx

      - name: Build (Release)
        run: dotnet build App.slnx -c Release --no-restore

      - name: Collect coverage (cobertura)
        # Wraps the whole `dotnet test` run out-of-process and merges coverage across all test
        # projects into a single cobertura report, without adding a collector package.
        run: |
          dotnet-coverage collect -f cobertura -o coverage/coverage.cobertura.xml "dotnet test App.slnx -c Release --no-build"

      - name: Diff coverage gate (>=80% on new/changed lines)
        # PR-SCOPED: diff-cover only scores the lines this PR changed vs the main merge-base
        # (--diff-range-notation=... = three-dot). Whole-codebase coverage is NOT gated — overall
        # coverage may be low while the CHANGED lines must still meet >=80%.
        run: diff-cover coverage/coverage.cobertura.xml --compare-branch=origin/main --diff-range-notation=... --fail-under=80 --html-report coverage/diff-cover.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/**
          retention-days: 30
