name: Build

on:
  # Manual trigger for on-demand pipeline testing (Actions -> Run workflow).
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job only reads the repo, it never needs to write anything.
permissions:
  contents: read

jobs:
  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Actions are pinned to a commit SHA (supply-chain integrity); the trailing comment is
        # the human-readable tag. Dependabot (github-actions ecosystem) bumps the SHA via PRs.
        # On GitHub Enterprise, confirm the action is allowlisted (docs/ci/ghe-allowlist.md).
        # fetch-depth: 0 is mandatory so Nerdbank.GitVersioning can compute git height.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        # global-json-file honours the SDK pin in global.json — do NOT also hard-code
        # dotnet-version here, or the two pins can drift apart.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Nerdbank.GitVersioning CLI
        # nbgv stays a CLI-only tool: it labels the CI run and the published artifact, it does
        # NOT stamp assemblies. Version authority belongs to <Version> in Directory.Build.props.
        # Adding the Nerdbank.GitVersioning MSBuild package would set Version per project and
        # break App.Architecture.Tests. Do not add it.
        run: dotnet tool install --global nbgv --version 3.6.146

      - name: Stamp version (nbgv cloud)
        run: nbgv cloud

      - name: Restore
        run: dotnet restore App.slnx

      - name: Build (Release)
        # TreatWarningsAsErrors + EnforceCodeStyleInBuild (Directory.Build.props) make any
        # analyzer/style warning fail this step — this is the green-build gate.
        run: dotnet build App.slnx -c Release --no-restore
